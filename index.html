const CAT_COLOR = {"遊戲":"#7a4a9e","模擬視覺化":"#1f5a64","文件簡報":"#33558c","創意藝術":"#b9504f","工程研究":"#2d6647"};
let cat="all", pt="all", q="";

const cats = ["all",...Object.keys(CAT_COLOR)];
document.getElementById('cats').innerHTML = cats.map(c=>
  `<span class="chip${c==='all'?' on':''}" data-c="${c}">${c==='all'?'全部分類':c}</span>`).join('');

function render(){
  const grid = document.getElementById('grid');
  const list = CASES.filter(x=>
    (cat==='all'||x.cat===cat) && (pt==='all'||x.ptype===pt) &&
    (!q || (x.title+x.desc+x.author+x.prompt).toLowerCase().includes(q)));
  grid.innerHTML = list.map((x,i)=>{
    const tid = (x.url.match(/status\/(\d+)/)||[])[1];
    const img = x.img || (tid ? `media/${tid}.jpg` : null);
    return `
    <div class="card" data-i="${i}">
      <div class="stripe" style="background:${CAT_COLOR[x.cat]}"></div>
      ${img?`<img class="shot" src="${img}" loading="lazy" alt="" onerror="this.remove()">`:''}
      <div class="body">
        <div class="cat" style="color:${CAT_COLOR[x.cat]}">${x.cat}<span class="badge ${x.ptype==='原文'?'b-orig':'b-recon'}">${x.ptype} prompt</span></div>
        <h3>${x.title}</h3>
        <div class="desc">${x.desc}</div>
        <div class="meta">${x.author} · ❤️ ${x.likes.toLocaleString()} · <a href="${x.url}" target="_blank">原推 ↗</a></div>
        <span class="ptoggle">▸ 看 prompt</span>
        <div class="prompt">${x.prompt.replace(/</g,'&lt;')}</div>
        <button class="copy">📋 複製 prompt</button>
      </div>
    </div>`;}).join('');
  document.getElementById('empty').style.display = list.length?'none':'block';
  document.getElementById('stats').textContent =
    `${CASES.length} 個案例 · ${CASES.filter(x=>x.ptype==='原文').length} 個原文 prompt · ${CASES.filter(x=>x.ptype==='重建').length} 個重建 prompt · 目前顯示 ${list.length} 個`;

  grid.querySelectorAll('.ptoggle').forEach(el=>el.onclick=e=>{
    const card = e.target.closest('.card');
    card.classList.toggle('open');
    e.target.textContent = card.classList.contains('open')?'▾ 收起 prompt':'▸ 看 prompt';
  });
  grid.querySelectorAll('.copy').forEach((el,idx)=>el.onclick=e=>{
    navigator.clipboard.writeText(list[idx].prompt);
    e.target.textContent='✅ 已複製'; e.target.classList.add('done');
    setTimeout(()=>{e.target.textContent='📋 複製 prompt'; e.target.classList.remove('done');},1500);
  });
}

document.getElementById('cats').onclick=e=>{
  if(!e.target.dataset.c) return;
  cat=e.target.dataset.c;
  document.querySelectorAll('#cats .chip').forEach(c=>c.classList.toggle('on',c===e.target));
  render();
};
document.querySelectorAll('[data-p]').forEach(el=>el.onclick=e=>{
  pt=e.target.dataset.p;
  document.querySelectorAll('[data-p]').forEach(c=>c.classList.toggle('on',c===e.target));
  render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
